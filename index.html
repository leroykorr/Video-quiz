<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English Video Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; color: white; margin: 0; padding: 0; padding-bottom: 50px; text-align: center; scroll-behavior: smooth; }
        
        /* Шапка с командами и уровнями */
        .scoreboard { position: sticky; top: 0; background-color: #16213e; border-bottom: 4px solid #e94560; box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 1000; padding: 10px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
        .team-card { background-color: #34495e; padding: 8px; border-radius: 10px; display: flex; align-items: center; gap: 5px; }
        .team-name { width: 70px; font-size: 16px; font-weight: bold; background: transparent; border: none; color: #f1c40f; text-align: center; border-bottom: 1px dashed #7f8c8d; outline: none;}
        .team-score { width: 40px; font-size: 20px; font-weight: bold; background: transparent; border: none; color: white; text-align: center; outline: none;}
        .btn-plus { background-color: #2ecc71; color: white; border: none; border-radius: 5px; padding: 5px 10px; font-size: 16px; cursor: pointer; }
        .btn-minus { background-color: #e74c3c; color: white; border: none; border-radius: 5px; padding: 5px 10px; font-size: 16px; cursor: pointer; }
        
        /* Панель уровней */
        .level-panel { display: flex; gap: 5px; background-color: #0f3460; padding: 5px; border-radius: 8px; }
        .level-btn { padding: 8px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; background-color: #533483; transition: 0.2s; }
        .level-btn.active { background-color: #e94560; box-shadow: 0 0 10px #e94560; }
        .settings-btn { background-color: #e94560; color: white; border: none; padding: 10px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* --- КНОПКИ ПРОКРУТКИ (шаг 40%) --- */
        .scroll-controls { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1500; }
        .scroll-btn { width: 60px; height: 60px; background-color: #e94560; color: white; border: 3px solid #ffffff; border-radius: 50%; font-size: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .scroll-btn:hover { background-color: #c9344b; transform: scale(1.1); }
        .scroll-btn:active { transform: scale(0.9); }

        /* Модальное окно настроек */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background-color: #16213e; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; border: 3px solid #e94560; }
        .modal-content input { width: 80%; padding: 10px; font-size: 16px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #7f8c8d; }
        .modal-actions { margin-top: 15px; display: flex; justify-content: space-around; }
        .modal-actions button { padding: 10px 20px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-save { background-color: #2ecc71; color: white; }
        .btn-cancel { background-color: #e74c3c; color: white; }

        /* Основной контент */
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .video-section { background-color: #16213e; border-radius: 15px; padding: 15px; margin-bottom: 30px; border: 3px solid #533483; }
        .video-title { font-size: 22px; color: #e94560; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; }
        .player-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; margin-bottom: 15px; }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 10px; border: none; }
        .video-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .video-controls button { padding: 10px 15px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: white; background-color: #2ecc71; }
        
        /* Вопросы */
        .question-block { background-color: #f5f5f5; color: #16213e; padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: left; }
        .q-text-en { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .q-text-zh { font-size: 16px; color: #34495e; margin-bottom: 2px; }
        .q-text-py { font-size: 12px; color: #7f8c8d; font-style: italic; margin-bottom: 15px; }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .options-grid.four-options { grid-template-columns: 1fr 1fr; }
        
        .option-btn { 
            background-color: #ecf0f1; border: 2px solid #bdc3c7; padding: 10px; border-radius: 10px; 
            cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; 
            transition: background-color 0.2s; width: 100%; box-sizing: border-box;
        }
        .option-btn:hover { background-color: #e8f4fd; }
        
        .option-letter { background-color: #34495e; color: white; min-width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 16px; font-weight: bold; }
        .option-text-container { display: flex; flex-direction: column; }
        
        .opt-en { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .opt-zh { font-size: 14px; color: #34495e; }
        .opt-py { font-size: 11px; color: #7f8c8d; font-style: italic; }

        .option-btn.correct { background-color: #2ecc71; border-color: #27ae60; }
        .option-btn.correct .opt-en, .option-btn.correct .opt-zh, .option-btn.correct .opt-py { color: white; }
        .option-btn.correct .option-letter { background-color: white; color: #2ecc71; }

        .option-btn.wrong { background-color: #e74c3c; border-color: #c0392b; opacity: 0.8; }
        .option-btn.wrong .opt-en, .option-btn.wrong .opt-zh, .option-btn.wrong .opt-py { color: white; }
        .option-btn.wrong .option-letter { background-color: white; color: #e74c3c; }

        .option-btn:disabled { cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="scoreboard" id="scoreboard">
        <div class="level-panel">
            <button class="level-btn" onclick="setLevel('all')" id="btn-lvl-all">All</button>
            <button class="level-btn active" onclick="setLevel(0)" id="btn-lvl-0">L0</button>
            <button class="level-btn" onclick="setLevel(1)" id="btn-lvl-1">L1</button>
            <button class="level-btn" onclick="setLevel(2)" id="btn-lvl-2">L2</button>
        </div>
        <button class="settings-btn" onclick="openSettings()">⚙️ Edit Teams</button>
    </div>

    <div class="scroll-controls">
        <button class="scroll-btn" onclick="scrollUp()">⬆</button>
        <button class="scroll-btn" onclick="scrollDown()">⬇</button>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>Team Settings</h2>
            <div id="teamInputsContainer"></div>
            <button onclick="addTeamInput()" style="margin-bottom: 15px; background-color: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">+ Add Team</button>
            <div class="modal-actions">
                <button class="btn-save" onclick="saveSettings()">Save</button>
                <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="container" id="quizContainer"></div>

    <script>
        function scrollUp() { window.scrollBy({ top: -window.innerHeight * 0.4, behavior: 'smooth' }); }
        function scrollDown() { window.scrollBy({ top: window.innerHeight * 0.4, behavior: 'smooth' }); }

        let currentLevelFilter = 0;

        function setLevel(level) {
            currentLevelFilter = level;
            document.getElementById('btn-lvl-all').classList.remove('active');
            document.getElementById('btn-lvl-0').classList.remove('active');
            document.getElementById('btn-lvl-1').classList.remove('active');
            document.getElementById('btn-lvl-2').classList.remove('active');
            
            if (level === 'all') document.getElementById('btn-lvl-all').classList.add('active');
            else if (level === 0) document.getElementById('btn-lvl-0').classList.add('active');
            else if (level === 1) document.getElementById('btn-lvl-1').classList.add('active');
            else if (level === 2) document.getElementById('btn-lvl-2').classList.add('active');

            renderQuiz();
        }

        // БАЗА ДАННЫХ (L0 с китайским и 2 вариантами, L1/L2 чистый английский по 4 варианта)
        const quizData = [
            {
                title: "Video 1: The Newspaper",
                youtubeId: "mQz3G0G3XHs", 
                startTime: 4, endTime: 15,  
                questions: [
                    // --- L0 ---
                    { 
                        level: 0,
                        en: "Who is on the couch?", zh: "誰在沙發上？", py: "Shéi zài shāfā shàng?",
                        options: [
                            { key: 1, en: "Mom", zh: "妈妈", py: "māma" },
                            { key: 2, en: "Dad", zh: "爸爸", py: "bàba", correct: true }
                        ]
                    },
                    { 
                        level: 0,
                        en: "What is Dad reading?", zh: "爸爸在看什麼？", py: "Bàba zài kàn shénme?",
                        options: [
                            { key: 1, en: "A book", zh: "书", py: "shū" },
                            { key: 2, en: "A newspaper", zh: "报纸", py: "bàozhǐ", correct: true }
                        ]
                    },
                    { 
                        level: 0,
                        en: "What room is Dad in?", zh: "爸爸在哪個房間？", py: "Bàba zài nǎ ge fángjiān?",
                        options: [
                            { key: 1, en: "Living room", zh: "客厅", py: "kètīng", correct: true },
                            { key: 2, en: "Kitchen", zh: "厨房", py: "chúfáng" }
                        ]
                    },
                    // --- L1 ---
                    { level: 1, en: "Who is on the couch?", options: [ {key:1, en:"Mom"}, {key:2, en:"Dad", correct:true}, {key:3, en:"Bluey"}, {key:4, en:"Bingo"} ] },
                    { level: 1, en: "What do the kids want?", options: [ {key:1, en:"A song", correct:true}, {key:2, en:"A toy"}, {key:3, en:"An apple"}, {key:4, en:"A book"} ] },
                    { level: 1, en: "Does Dad say 'Yes'?", options: [ {key:1, en:"Yes", correct:true}, {key:2, en:"No"}, {key:3, en:"He is sleeping"}, {key:4, en:"He is angry"} ] },
                    // --- L2 ---
                    { level: 2, en: "How does Dad feel at the beginning?", options: [ {key:1, en:"Relaxed", correct:true}, {key:2, en:"Angry"}, {key:3, en:"Scared"}, {key:4, en:"Sad"} ] },
                    { level: 2, en: "What is Dad reading?", options: [ {key:1, en:"A newspaper", correct:true}, {key:2, en:"A book"}, {key:3, en:"A magazine"}, {key:4, en:"A comic"} ] },
                    { level: 2, en: "What shouldn't the song be?", options: [ {key:1, en:"Annoying", correct:true}, {key:2, en:"Fast"}, {key:3, en:"Long"}, {key:4, en:"Sad"} ] }
                ]
            },
            {
                title: "Video 2: Burger Dog",
                youtubeId: "mQz3G0G3XHs", 
                startTime: 15, endTime: 32,  
                questions: [
                    // --- L0 ---
                    { 
                        level: 0,
                        en: "What is the song?", zh: "這首歌是什麼？", py: "Zhè shǒu gē shì shénme?",
                        options: [
                            { key: 1, en: "Cat Dog", zh: "猫狗", py: "māo gǒu" },
                            { key: 2, en: "Burger Dog", zh: "汉堡狗", py: "hànbǎo gǒu", correct: true }
                        ]
                    },
                    { 
                        level: 0,
                        en: "What is inside the burger?", zh: "漢堡裡有什麼？", py: "Hànbǎo lǐ yǒu shénme?",
                        options: [
                            { key: 1, en: "Cheese", zh: "奶酪", py: "nǎilào", correct: true },
                            { key: 2, en: "Fish", zh: "鱼", py: "yú" }
                        ]
                    },
                    { 
                        level: 0,
                        en: "What are the kids doing?", zh: "孩子們在做什麼？", py: "Háizimen zài zuò shénme?",
                        options: [
                            { key: 1, en: "Sleeping", zh: "睡觉", py: "shuìjiào" },
                            { key: 2, en: "Dancing", zh: "跳舞", py: "tiàowǔ", correct: true }
                        ]
                    },
                    // --- L1 ---
                    { level: 1, en: "What is the name of the song?", options: [ {key:1, en:"Burger Cat"}, {key:2, en:"Burger Dog", correct:true}, {key:3, en:"Hot Dog"}, {key:4, en:"Pizza"} ] },
                    { level: 1, en: "What does the burger have inside?", options: [ {key:1, en:"Pickles and cheese", correct:true}, {key:2, en:"Fish and chips"}, {key:3, en:"Apple and banana"}, {key:4, en:"Bread and butter"} ] },
                    { level: 1, en: "What are the kids doing?", options: [ {key:1, en:"Sleeping"}, {key:2, en:"Dancing", correct:true}, {key:3, en:"Reading"}, {key:4, en:"Eating"} ] },
                    // --- L2 ---
                    { level: 2, en: "Who asks: 'What's it called?'", options: [ {key:1, en:"Bluey"}, {key:2, en:"Bingo"}, {key:3, en:"Dad", correct:true}, {key:4, en:"Mom"} ] },
                    { level: 2, en: "How does Dad react when he hears the song?", options: [ {key:1, en:"He says it's not annoying", correct:true}, {key:2, en:"He turns it off"}, {key:3, en:"He gets angry"}, {key:4, en:"He sings loudly"} ] },
                    { level: 2, en: "What is NOT mentioned in the song?", options: [ {key:1, en:"Cheese"}, {key:2, en:"Pickles"}, {key:3, en:"Tomatoes", correct:true}, {key:4, en:"Sugar"} ] }
                ]
            },
            {
                title: "Video 3: Out of Battery",
                youtubeId: "mQz3G0G3XHs", 
                startTime: 45, endTime: 58,  
                questions: [
                    // --- L0 ---
                    { 
                        level: 0,
                        en: "What color is the phone?", zh: "手機是什麼顏色？", py: "Shǒujī shì shénme yánsè?",
                        options: [
                            { key: 1, en: "White", zh: "白色", py: "báisè" },
                            { key: 2, en: "Black", zh: "黑色", py: "hēisè", correct: true }
                        ]
                    },
                    { 
                        level: 0,
                        en: "Is the phone dead?", zh: "手機沒電了嗎？", py: "Shǒujī méi diàn le ma?",
                        options: [
                            { key: 1, en: "Maybe", zh: "可能", py: "kěnéng" },
                            { key: 2, en: "Yes", zh: "是的", py: "shì de", correct: true }
                        ]
                    },
                    { 
                        level: 0,
                        en: "What color is the couch?", zh: "沙發是什麼顏色？", py: "Shāfā shì shénme yánsè?",
                        options: [
                            { key: 1, en: "Red", zh: "红色", py: "hóngsè", correct: true },
                            { key: 2, en: "Blue", zh: "蓝色", py: "lánsè" }
                        ]
                    },
                    // --- L1 ---
                    { level: 1, en: "What does Dad say about his phone?", options: [ {key:1, en:"It is broken"}, {key:2, en:"It is out of battery", correct:true}, {key:3, en:"It is lost"}, {key:4, en:"It is new"} ] },
                    { level: 1, en: "What color is the phone screen?", options: [ {key:1, en:"Red"}, {key:2, en:"Green"}, {key:3, en:"Black", correct:true}, {key:4, en:"White"} ] },
                    { level: 1, en: "Does Bluey believe Dad?", options: [ {key:1, en:"Yes"}, {key:2, en:"No", correct:true}, {key:3, en:"She is sleeping"}, {key:4, en:"She is crying"} ] },
                    // --- L2 ---
                    { level: 2, en: "Why does Dad say his phone is out of battery?", options: [ {key:1, en:"He wants to stop playing the song", correct:true}, {key:2, en:"The phone is really broken"}, {key:3, en:"He wants to go to sleep"}, {key:4, en:"He is playing a game"} ] },
                    { level: 2, en: "What does Bluey say to Dad?", options: [ {key:1, en:"No, it hasn't.", correct:true}, {key:2, en:"Yes, it has."}, {key:3, en:"I want a new phone."}, {key:4, en:"Let's go to sleep."} ] },
                    { level: 2, en: "What does Bluey see on the phone?", options: [ {key:1, en:"A black screen", correct:true}, {key:2, en:"A funny video"}, {key:3, en:"A new game"}, {key:4, en:"A red battery"} ] }
                ]
            },
            {
                title: "Video 4: The Lie",
                youtubeId: "mQz3G0G3XHs", 
                startTime: 77, endTime: 92,  
                questions: [
                    // --- L0 ---
                    { 
                        level: 0,
                        en: "Who calls Dad?", zh: "誰給爸爸打電話？", py: "Shéi gěi bàba dǎ diànhuà?",
                        options: [
                            { key: 1, en: "Mom", zh: "妈妈", py: "māma", correct: true },
                            { key: 2, en: "Bingo", zh: "宾果", py: "bīnguǒ" }
                        ]
                    },
                    { 
                        level: 0,
                        en: "Is Dad lying?", zh: "爸爸在撒謊嗎？", py: "Bàba zài sāhuǎng ma?",
                        options: [
                            { key: 1, en: "Maybe", zh: "可能", py: "kěnéng" },
                            { key: 2, en: "Yes", zh: "是的", py: "shì de", correct: true }
                        ]
                    },
                    { 
                        level: 0,
                        en: "Is Mom happy?", zh: "媽媽開心嗎？", py: "Māma kāixīn ma?",
                        options: [
                            { key: 1, en: "Yes", zh: "是的", py: "shì de" },
                            { key: 2, en: "No", zh: "不", py: "bù", correct: true }
                        ]
                    },
                    // --- L1 ---
                    { level: 1, en: "What is Mom doing?", options: [ {key:1, en:"Cooking"}, {key:2, en:"Calling on the phone", correct:true}, {key:3, en:"Sleeping"}, {key:4, en:"Reading"} ] },
                    { level: 1, en: "What does Dad say to Bluey?", options: [ {key:1, en:"I love you."}, {key:2, en:"I would never lie to you.", correct:true}, {key:3, en:"Let's go to sleep."}, {key:4, en:"Give me the phone."} ] },
                    { level: 1, en: "Does Dad say he is lying?", options: [ {key:1, en:"Yes", correct:true}, {key:2, en:"No"}, {key:3, en:"He is sleeping"}, {key:4, en:"He is crying"} ] },
                    // --- L2 ---
                    { level: 2, en: "What does Mom ask Dad?", options: [ {key:1, en:"Are you playing a game?"}, {key:2, en:"Are you lying to your children again?", correct:true}, {key:3, en:"Where is your phone?"}, {key:4, en:"Are you sleeping?"} ] },
                    { level: 2, en: "What does Dad promise Bluey before Mom calls?", options: [ {key:1, en:"I would never lie to you.", correct:true}, {key:2, en:"I will buy you a toy."}, {key:3, en:"I am very tired."}, {key:4, en:"Let's eat a burger."} ] },
                    { level: 2, en: "Why does Mom say 'again'?", options: [ {key:1, en:"Because Dad lies to the kids often.", correct:true}, {key:2, en:"Because Dad is sleeping."}, {key:3, en:"Because the phone is broken."}, {key:4, en:"Because Bluey is crying."} ] }
                ]
            }
        ];

        let teams = JSON.parse(localStorage.getItem('videoQuizTeams')) || [{ name: "Red", score: 0 }, { name: "Blue", score: 0 }];

        function renderScoreboard() {
            const header = document.getElementById('scoreboard');
            Array.from(header.children).forEach(child => { if (child.classList.contains('team-card')) header.removeChild(child); });
            teams.forEach((team, index) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <input type="text" class="team-name" value="${team.name}" onchange="updateTeamName(${index}, this.value)">
                    <button class="btn-minus" onclick="changeScore(${index}, -1)">-</button>
                    <input type="number" class="team-score" value="${team.score}" onchange="updateScore(${index}, this.value)">
                    <button class="btn-plus" onclick="changeScore(${index}, 1)">+</button>
                `;
                header.insertBefore(card, header.querySelector('.settings-btn'));
            });
        }
        function changeScore(index, amount) { teams[index].score += amount; saveData(); renderScoreboard(); }
        function updateScore(index, value) { teams[index].score = parseInt(value) || 0; saveData(); renderScoreboard(); }
        function updateTeamName(index, value) { teams[index].name = value; saveData(); }
        function saveData() { localStorage.setItem('videoQuizTeams', JSON.stringify(teams)); }

        function openSettings() { const c = document.getElementById('teamInputsContainer'); c.innerHTML = ''; teams.forEach(t => addTeamInput(t.name)); document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        function addTeamInput(value = "") { const c = document.getElementById('teamInputsContainer'); const i = document.createElement('input'); i.type = 'text'; i.value = value; i.placeholder = "Team Name"; i.className = "team-settings-input"; i.style.display = "block"; i.style.margin = "0 auto 10px auto"; c.appendChild(i); }
        function saveSettings() {
            const inputs = document.querySelectorAll('.team-settings-input'); const newTeams = [];
            inputs.forEach(i => { if (i.value.trim() !== "") { const ex = teams.find(t => t.name === i.value.trim()); newTeams.push({ name: i.value.trim(), score: ex ? ex.score : 0 }); } });
            if (newTeams.length > 0) { teams = newTeams; saveData(); renderScoreboard(); } closeSettings();
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            quizData.forEach((videoData, vIndex) => {
                const section = document.createElement('div');
                section.className = 'video-section';
                
                let qHTML = '';
                let questionNumber = 1;

                videoData.questions.forEach((q) => {
                    if (currentLevelFilter !== 'all' && q.level !== currentLevelFilter) return;

                    let optHTML = '';
                    q.options.forEach(opt => {
                        let textHTML = `<span class="opt-en">${opt.en}</span>`;
                        if (q.level === 0 && opt.zh) {
                            textHTML += `<span class="opt-zh">${opt.zh}</span><span class="opt-py">${opt.py}</span>`;
                        }
                        optHTML += `<button class="option-btn" onclick="checkAnswer(this, ${opt.correct || false})"><span class="option-letter">${opt.key}</span><div class="option-text-container">${textHTML}</div></button>`;
                    });

                    let qTextHTML = `<div class="q-text-en">${questionNumber}. ${q.en}</div>`;
                    if (q.level === 0 && q.zh) {
                        qTextHTML += `<div class="q-text-zh">${q.zh}</div><div class="q-text-py">${q.py}</div>`;
                    }

                    let gridClass = q.level === 0 ? 'options-grid' : 'options-grid four-options';
                    qHTML += `<div class="question-block">${qTextHTML}<div class="${gridClass}">${optHTML}</div></div>`;
                    questionNumber++;
                });

                section.innerHTML = `
                    <h2 class="video-title">${videoData.title}</h2>
                    <div class="player-wrapper"><iframe id="video-${vIndex}" src="https://www.youtube.com/embed/${videoData.youtubeId}?start=${videoData.startTime}&end=${videoData.endTime}&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
                    <div class="video-controls"><button onclick="reloadVideo(${vIndex})">▶ Replay</button></div>
                    ${qHTML}
                `;
                container.appendChild(section);
            });
        }

        function reloadVideo(index) { const iframe = document.getElementById(`video-${index}`); iframe.src = iframe.src; }

        function checkAnswer(btnElement, isCorrect) {
            if (btnElement.parentElement.querySelector('.correct')) return;
            const options = btnElement.parentElement.querySelectorAll('.option-btn');
            options.forEach(opt => {
                opt.disabled = true;
                if (opt === btnElement) { if (isCorrect) opt.classList.add('correct'); else opt.classList.add('wrong'); }
                // Также подсвечиваем правильный, если нажали на неправильный
                else if (opt.getAttribute('onclick').includes('true')) opt.classList.add('correct');
            });
        }

        window.onload = function() { renderScoreboard(); renderQuiz(); };
    </script>
</body>
</html>
