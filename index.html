<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English Video Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; color: white; margin: 0; padding: 0; padding-bottom: 50px; text-align: center; scroll-behavior: smooth; }
        
        /* Шапка с командами, вкладками и уровнями */
        .scoreboard { position: sticky; top: 0; background-color: #16213e; border-bottom: 4px solid #e94560; box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 1000; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        
        .top-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        .tab-panel { display: flex; gap: 10px; }
        .main-tab { padding: 10px 20px; font-size: 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background-color: #533483; color: white; transition: 0.3s; }
        .main-tab.active { background-color: #e94560; box-shadow: 0 0 10px #e94560; }

        .level-panel { display: flex; gap: 5px; background-color: #0f3460; padding: 5px; border-radius: 8px; }
        .level-btn { padding: 8px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; background-color: #34495e; transition: 0.2s; }
        .level-btn.active { background-color: #2ecc71; color: white; box-shadow: 0 0 10px #2ecc71; }
        
        .team-container { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .team-card { background-color: #34495e; padding: 5px 10px; border-radius: 10px; display: flex; align-items: center; gap: 5px; }
        .team-name { width: 60px; font-size: 14px; font-weight: bold; background: transparent; border: none; color: #f1c40f; text-align: center; border-bottom: 1px dashed #7f8c8d; outline: none;}
        .team-score { width: 35px; font-size: 18px; font-weight: bold; background: transparent; border: none; color: white; text-align: center; outline: none;}
        .btn-plus { background-color: #2ecc71; color: white; border: none; border-radius: 5px; padding: 2px 8px; font-size: 14px; cursor: pointer; }
        .btn-minus { background-color: #e74c3c; color: white; border: none; border-radius: 5px; padding: 2px 8px; font-size: 14px; cursor: pointer; }
        .settings-btn { background-color: #3498db; color: white; border: none; padding: 5px 10px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* Кнопки прокрутки (40% шаг) */
        .scroll-controls { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1500; }
        .scroll-btn { width: 50px; height: 50px; background-color: #e94560; color: white; border: 3px solid #ffffff; border-radius: 50%; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .scroll-btn:hover { background-color: #c9344b; transform: scale(1.1); }
        .scroll-btn:active { transform: scale(0.9); }

        /* Модальное окно настроек */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background-color: #16213e; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; border: 3px solid #e94560; }
        .modal-content input { width: 80%; padding: 10px; font-size: 16px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #7f8c8d; }
        .modal-actions { margin-top: 15px; display: flex; justify-content: space-around; }
        .modal-actions button { padding: 10px 20px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }

        /* Основной контент */
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .video-section { background-color: #16213e; border-radius: 15px; padding: 15px; margin-bottom: 30px; border: 3px solid #533483; }
        .video-title { font-size: 22px; color: #e94560; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; }
        .player-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; margin-bottom: 15px; }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 10px; border: none; }
        .video-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .video-controls button { padding: 10px 15px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: white; background-color: #2ecc71; }
        
        /* Вопросы */
        .question-block { background-color: #f5f5f5; color: #16213e; padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: left; }
        .q-text-en { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .q-text-zh { font-size: 16px; color: #34495e; margin-bottom: 2px; }
        .q-text-py { font-size: 12px; color: #7f8c8d; font-style: italic; margin-bottom: 15px; }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .options-grid.four-options { grid-template-columns: 1fr 1fr; }
        
        .option-btn { 
            background-color: #ecf0f1; border: 2px solid #bdc3c7; padding: 10px; border-radius: 10px; 
            cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; 
            transition: background-color 0.2s; width: 100%; box-sizing: border-box;
        }
        .option-btn:hover { background-color: #e8f4fd; }
        
        .option-letter { background-color: #34495e; color: white; min-width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 16px; font-weight: bold; }
        .option-text-container { display: flex; flex-direction: column; }
        
        .opt-en { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .opt-zh { font-size: 14px; color: #34495e; }
        .opt-py { font-size: 11px; color: #7f8c8d; font-style: italic; }

        .option-btn.correct { background-color: #2ecc71; border-color: #27ae60; }
        .option-btn.correct .opt-en, .option-btn.correct .opt-zh, .option-btn.correct .opt-py { color: white; }
        .option-btn.correct .option-letter { background-color: white; color: #2ecc71; }

        .option-btn.wrong { background-color: #e74c3c; border-color: #c0392b; opacity: 0.8; }
        .option-btn.wrong .opt-en, .option-btn.wrong .opt-zh, .option-btn.wrong .opt-py { color: white; }
        .option-btn.wrong .option-letter { background-color: white; color: #e74c3c; }

        .option-btn:disabled { cursor: not-allowed; }
    </style>
</head>

        }

        function scrollUp() { window.scrollBy({ top: -window.innerHeight * 0.4, behavior: 'smooth' }); }
        function scrollDown() { window.scrollBy({ top: window.innerHeight * 0.4, behavior: 'smooth' }); }

        function renderScoreboard() {
            const container = document.getElementById('teamContainer');
            container.innerHTML = '';
            teams.forEach((team, index) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <input type="text" class="team-name" value="${team.name}" onchange="updateTeamName(${index}, this.value)">
                    <button class="btn-minus" onclick="changeScore(${index}, -1)">-</button>
                    <input type="number" class="team-score" value="${team.score}" onchange="updateScore(${index}, this.value)">
                    <button class="btn-plus" onclick="changeScore(${index}, 1)">+</button>
                `;
                container.appendChild(card);
            });
        }

        function changeScore(index, amount) { teams[index].score += amount; saveData(); renderScoreboard(); }
        function updateScore(index, value) { teams[index].score = parseInt(value) || 0; saveData(); renderScoreboard(); }
        function updateTeamName(index, value) { teams[index].name = value; saveData(); }
        function saveData() { 
            try { localStorage.setItem('videoQuizTeams', JSON.stringify(teams)); } catch(e) {} 
        }

        function openSettings() { const c = document.getElementById('teamInputsContainer'); c.innerHTML = ''; teams.forEach(t => addTeamInput(t.name)); document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        function addTeamInput(value = "") { const c = document.getElementById('teamInputsContainer'); const i = document.createElement('input'); i.type = 'text'; i.value = value; i.placeholder = "Team Name"; i.className = "team-settings-input"; c.appendChild(i); }
        function saveSettings() {
            const inputs = document.querySelectorAll('.team-settings-input'); const newTeams = [];
            inputs.forEach(i => { if (i.value.trim() !== "") { const ex = teams.find(t => t.name === i.value.trim()); newTeams.push({ name: i.value.trim(), score: ex ? ex.score : 0 }); } });
            if (newTeams.length > 0) { teams = newTeams; saveData(); renderScoreboard(); } closeSettings();
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            let tempArray = [...array]; 
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [tempArray[currentIndex], tempArray[randomIndex]] = [tempArray[randomIndex], tempArray[currentIndex]];
            }
            return tempArray;
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            
            const currentData = quizData[currentTab];
            if (!currentData) return;

            let questionNumber = 1;

            currentData.forEach((videoData, vIndex) => {
                const section = document.createElement('div');
                section.className = 'video-section';
                
                let qHTML = '';

                videoData.questions.forEach((q) => {
                    let correctOpt = q.options.find(o => o.correct);
                    let wrongOpts = q.options.filter(o => !o.correct);

                    let displayOpts = [];
                    if (currentLevel === 0) {
                        let randomWrong = wrongOpts[Math.floor(Math.random() * wrongOpts.length)];
                        displayOpts = [correctOpt, randomWrong];
                    } else {
                        displayOpts = q.options;
                    }

                    displayOpts = shuffle(displayOpts);

                    let optHTML = '';
                    displayOpts.forEach((opt, idx) => {
                        let textHTML = `<span class="opt-en">${opt.en}</span>`;
                        // Если уровень 0 - показываем китайский и пиньинь
                        if (currentLevel === 0 && opt.zh) {
                            textHTML += `<span class="opt-zh">${opt.zh}</span><span class="opt-py">${opt.py}</span>`;
                        }
                        optHTML += `<button class="option-btn" onclick="checkAnswer(this, ${opt.correct})"><span class="option-letter">${idx + 1}</span><div class="option-text-container">${textHTML}</div></button>`;
                    });

                    let qTextHTML = `<div class="q-text-en">${questionNumber}. ${q.en}</div>`;
                    // Если уровень 0 - показываем китайский и пиньинь
                    if (currentLevel === 0 && q.zh) {
                        qTextHTML += `<div class="q-text-zh">${q.zh}</div><div class="q-text-py">${q.py}</div>`;
                    }

                    let gridClass = currentLevel === 0 ? 'options-grid' : 'options-grid four-options';
                    qHTML += `<div class="question-block">${qTextHTML}<div class="${gridClass}">${optHTML}</div></div>`;
                    questionNumber++;
                });

                section.innerHTML = `
                    <h2 class="video-title">${videoData.title}</h2>
                    <div class="player-wrapper"><iframe id="video-${currentTab}-${vIndex}" src="https://www.youtube.com/embed/${videoData.youtubeId}?start=${videoData.startTime}&end=${videoData.endTime}&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
                    <div class="video-controls"><button onclick="reloadVideo('${currentTab}-${vIndex}')">▶ Replay</button></div>
                    ${qHTML}
                `;
                container.appendChild(section);
            });
        }

        function reloadVideo(id) { const iframe = document.getElementById(`video-${id}`); iframe.src = iframe.src; }

        function checkAnswer(btnElement, isCorrect) {
            if (btnElement.parentElement.querySelector('.correct')) return;
            const options = btnElement.parentElement.querySelectorAll('.option-btn');
            options.forEach(opt => {
                opt.disabled = true;
                if (opt === btnElement) { if (isCorrect) opt.classList.add('correct'); else opt.classList.add('wrong'); }
                else if (opt.getAttribute('onclick').includes('true')) opt.classList.add('correct');
            });
        }

        window.onload = function() {
            try {
                renderScoreboard();
                renderQuiz();
            } catch (e) {
                document.getElementById('quizContainer').innerHTML = `
                    <div style="background: #fff; color: #000; padding: 20px; margin: 20px; border-radius: 10px; text-align: left;">
                        <h2 style="color: red;">Ошибка загрузки:</h2>
                        <p><strong>${e.message}</strong></p>
                        <p>Попробуйте обновить страницу с зажатой клавишей Ctrl+F5, чтобы сбросить кэш.</p>
                    </div>
                `;
                console.error(e);
            }
        };
    </script>
</body>
</html>
