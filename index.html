<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English Video Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; color: white; margin: 0; padding: 0; padding-bottom: 50px; text-align: center; }
        .scoreboard { position: sticky; top: 0; background-color: #16213e; border-bottom: 4px solid #e94560; box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 1000; padding: 10px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
        .team-card { background-color: #34495e; padding: 8px; border-radius: 10px; display: flex; align-items: center; gap: 5px; }
        .team-name { width: 70px; font-size: 16px; font-weight: bold; background: transparent; border: none; color: #f1c40f; text-align: center; border-bottom: 1px dashed #7f8c8d; outline: none;}
        .team-score { width: 40px; font-size: 20px; font-weight: bold; background: transparent; border: none; color: white; text-align: center; outline: none;}
        .btn-plus { background-color: #2ecc71; color: white; border: none; border-radius: 5px; padding: 5px 10px; font-size: 16px; cursor: pointer; }
        .btn-minus { background-color: #e74c3c; color: white; border: none; border-radius: 5px; padding: 5px 10px; font-size: 16px; cursor: pointer; }
        .settings-btn { background-color: #e94560; color: white; border: none; padding: 10px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        
        /* Модальное окно настроек */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background-color: #16213e; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; border: 3px solid #e94560; }
        .modal-content input { width: 80%; padding: 10px; font-size: 16px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #7f8c8d; }
        .modal-actions { margin-top: 15px; display: flex; justify-content: space-around; }
        .modal-actions button { padding: 10px 20px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-save { background-color: #2ecc71; color: white; }
        .btn-cancel { background-color: #e74c3c; color: white; }

        /* Основной контент */
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .video-section { background-color: #16213e; border-radius: 15px; padding: 15px; margin-bottom: 30px; border: 3px solid #533483; }
        .video-title { font-size: 22px; color: #e94560; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; }
        .player-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; margin-bottom: 15px; }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 10px; border: none; }
        .video-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .video-controls button { padding: 10px 15px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: white; background-color: #2ecc71; }
        .question-block { background-color: #f5f5f5; color: #16213e; padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: left; }
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn { background-color: #ecf0f1; border: 2px solid #bdc3c7; padding: 10px; border-radius: 10px; font-size: 16px; font-weight: bold; color: #2c3e50; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; }
        .option-btn .letter { background-color: #34495e; color: white; width: 25px; height: 25px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 14px; }
        .option-btn.correct { background-color: #2ecc71; border-color: #27ae60; color: white; }
        .option-btn.wrong { background-color: #e74c3c; border-color: #c0392b; color: white; opacity: 0.7; }
        .option-btn:disabled { cursor: not-allowed; }
    </style>
</head>
<body>
    <!-- Панель счета с кнопкой настроек -->
    <div class="scoreboard" id="scoreboard">
        <button class="settings-btn" onclick="openSettings()">⚙️ Edit Teams</button>
    </div>

    <!-- Модальное окно для настройки команд -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>Team Settings</h2>
            <div id="teamInputsContainer"></div>
            <button onclick="addTeamInput()" style="margin-bottom: 15px; background-color: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">+ Add Team</button>
            <div class="modal-actions">
                <button class="btn-save" onclick="saveSettings()">Save</button>
                <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="container" id="quizContainer"></div>

    <script>
        // База видео
        const quizData = [
            {
                title: "Video 1: Bluey",
                youtubeId: "mQz3G0G3XHs", 
                startTime: 0, 
                endTime: 15,  
                questions: [
                    { text: "1. What is Bluey doing?", options: { A: "Sleeping", B: "Listening to music", C: "Eating", D: "Running" }, correct: "B" },
                    { text: "2. What does Bluey love?", options: { A: "Burger Dog", B: "Pizza", C: "Ice Cream", D: "Apples" }, correct: "A" }
                ]
            }
        ];

        // Логика команд
        let teams = JSON.parse(localStorage.getItem('videoQuizTeams')) || [
            { name: "Red", score: 0 },
            { name: "Blue", score: 0 }
        ];

        function renderScoreboard() {
            const header = document.getElementById('scoreboard');
            // Удаляем старые карточки, оставляя кнопку настроек
            Array.from(header.children).forEach(child => {
                if (!child.classList.contains('settings-btn')) header.removeChild(child);
            });

            teams.forEach((team, index) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <input type="text" class="team-name" value="${team.name}" onchange="updateTeamName(${index}, this.value)">
                    <button class="btn-minus" onclick="changeScore(${index}, -1)">-</button>
                    <input type="number" class="team-score" value="${team.score}" onchange="updateScore(${index}, this.value)">
                    <button class="btn-plus" onclick="changeScore(${index}, 1)">+</button>
                `;
                header.insertBefore(card, header.querySelector('.settings-btn'));
            });
        }

        function changeScore(index, amount) { teams[index].score += amount; saveData(); renderScoreboard(); }
        function updateScore(index, value) { teams[index].score = parseInt(value) || 0; saveData(); renderScoreboard(); }
        function updateTeamName(index, value) { teams[index].name = value; saveData(); }

        function saveData() {
            localStorage.setItem('videoQuizTeams', JSON.stringify(teams));
        }

        // Настройки
        function openSettings() {
            const container = document.getElementById('teamInputsContainer');
            container.innerHTML = '';
            teams.forEach(team => addTeamInput(team.name));
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function addTeamInput(value = "") {
            const container = document.getElementById('teamInputsContainer');
            const input = document.createElement('input');
            input.type = 'text'; input.value = value; input.placeholder = "Team Name";
            input.className = "team-settings-input";
            input.style.display = "block"; input.style.margin = "0 auto 10px auto";
            container.appendChild(input);
        }

        function saveSettings() {
            const inputs = document.querySelectorAll('.team-settings-input');
            const newTeams = [];
            inputs.forEach(input => {
                if (input.value.trim() !== "") {
                    const existing = teams.find(t => t.name === input.value.trim());
                    newTeams.push({ name: input.value.trim(), score: existing ? existing.score : 0 });
                }
            });
            if (newTeams.length > 0) {
                teams = newTeams;
                saveData();
                renderScoreboard();
            }
            closeSettings();
        }

        // Викторина
        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            quizData.forEach((videoData, vIndex) => {
                const section = document.createElement('div');
                section.className = 'video-section';
                
                let qHTML = '';
                videoData.questions.forEach((q) => {
                    let optHTML = '';
                    for (const [key, value] of Object.entries(q.options)) {
                        optHTML += `<button class="option-btn" onclick="checkAnswer(this, '${q.correct}', '${key}')"><span class="letter">${key}</span> ${value}</button>`;
                    }
                    qHTML += `<div class="question-block"><div class="question-text">${q.text}</div><div class="options-grid">${optHTML}</div></div>`;
                });

                section.innerHTML = `
                    <h2 class="video-title">${videoData.title}</h2>
                    <div class="player-wrapper">
                        <iframe id="video-${vIndex}" src="https://www.youtube.com/embed/${videoData.youtubeId}?start=${videoData.startTime}&end=${videoData.endTime}&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>
                    <div class="video-controls">
                        <button onclick="reloadVideo(${vIndex})">▶ Replay</button>
                    </div>
                    ${qHTML}
                `;
                container.appendChild(section);
            });
        }

        function reloadVideo(index) {
            const iframe = document.getElementById(`video-${index}`);
            iframe.src = iframe.src; 
        }

        function checkAnswer(btnElement, correct, selected) {
            if (btnElement.parentElement.querySelector('.correct')) return;
            const options = btnElement.parentElement.querySelectorAll('.option-btn');
            options.forEach(opt => {
                opt.disabled = true;
                const letter = opt.querySelector('.letter').innerText;
                if (letter === correct) opt.classList.add('correct');
                else if (letter === selected) opt.classList.add('wrong');
            });
        }

        window.onload = function() {
            renderScoreboard();
            renderQuiz();
        };
    </script>
</body>
</html>
